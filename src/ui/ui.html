<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Iconmaster</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--figma-color-bg);
        color: var(--figma-color-text);
        font: 12px/16px Inter, "Helvetica Neue", Arial, sans-serif;
      }
      button, input { font: inherit; color: inherit; }
      body { display: flex; }
      main {
        display: flex;
        flex-direction: column;
        width: 320px;
        height: 100%;
      }
      header { padding: 12px 12px 8px; }
      .count {
        margin: 0;
        display: flex;
        align-items: baseline;
        gap: 0;
        font-weight: 600;
      }
      .count .dot { color: var(--figma-color-text-tertiary); font-weight: 400; }
      #warning-toggle {
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        font-weight: 600;
        cursor: pointer;
        border-radius: 2px;
      }
      #warning-toggle:hover, #warning-toggle:focus-visible {
        background: var(--figma-color-bg-hover);
      }
      .scroll {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 0 12px 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .empty {
        margin: 4px 0;
        color: var(--figma-color-text-secondary);
      }
      .warnings {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-height: 132px;
        overflow: auto;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .warning {
        width: 100%;
        text-align: left;
        border: 1px solid var(--figma-color-border);
        background: var(--figma-color-bg);
        border-radius: 2px;
        padding: 6px 8px;
        cursor: pointer;
      }
      .warning:hover, .warning:focus-visible { background: var(--figma-color-bg-hover); }
      .warning:disabled { cursor: default; opacity: 0.6; }
      .kind {
        display: block;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--figma-color-text-secondary);
      }
      .warning strong {
        display: block;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .detail {
        display: block;
        margin-top: 2px;
        color: var(--figma-color-text-secondary);
      }
      .note { margin: 0; color: var(--figma-color-text-secondary); }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, 32px);
        gap: 4px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .thumb {
        width: 32px;
        height: 32px;
        border: 1px solid var(--figma-color-border);
        border-radius: 2px;
        background: var(--figma-color-bg-secondary);
        overflow: hidden;
      }
      .thumb.failed { border-color: var(--figma-color-border-danger, var(--figma-color-text-danger)); }
      .thumb img {
        display: block;
        width: 32px;
        height: 32px;
        object-fit: contain;
      }
      .options {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px 12px;
        border-top: 1px solid var(--figma-color-border);
      }
      .options h2 {
        margin: 0;
        font-size: 11px;
        font-weight: 600;
        color: var(--figma-color-text-secondary);
      }
      label.check {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      label.check input { margin-top: 2px; }
      .fields { display: flex; gap: 8px; }
      .fields label {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
        color: var(--figma-color-text-secondary);
      }
      input[type="text"] {
        height: 28px;
        border: 1px solid var(--figma-color-border);
        background: var(--figma-color-bg);
        border-radius: 2px;
        padding: 0 8px;
      }
      .activity {
        padding: 0 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .summary { margin: 0; font-weight: 600; }
      .errors {
        margin: 0;
        padding: 0;
        list-style: none;
        max-height: 64px;
        overflow: auto;
        color: var(--figma-color-text-danger);
      }
      footer { padding: 8px 12px 12px; }
      button.primary {
        position: relative;
        width: 100%;
        height: 32px;
        border: 1px solid transparent;
        border-radius: 2px;
        background: var(--figma-color-bg-inverse);
        color: var(--figma-color-text-oninverse);
        font-weight: 600;
        overflow: hidden;
        cursor: pointer;
      }
      button.primary.busy {
        border-color: var(--figma-color-border);
        background: var(--figma-color-bg);
        color: var(--figma-color-text);
        cursor: default;
      }
      button.primary:disabled {
        background: var(--figma-color-bg-disabled);
        color: var(--figma-color-text-disabled);
        cursor: default;
      }
      #export-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0;
        background: var(--figma-color-bg-pressed);
      }
      button.primary:not(.busy) #export-fill { display: none; }
      #export-label { position: relative; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="count" id="count">Leyendo la selección…</p>
      </header>
      <div class="scroll">
        <ul class="warnings hidden" id="warnings"></ul>
        <p class="note hidden" id="truncated">Se muestran los primeros 100 avisos.</p>
        <ul class="grid" id="icons"></ul>
        <p class="empty hidden" id="empty">Selecciona marcos, componentes, variantes o instancias.</p>
      </div>
      <div class="options">
        <label class="check">
          <input id="current-color" type="checkbox" checked />
          <span>
            <strong>currentColor</strong>
            <span class="detail">Los rellenos sólidos heredan el color del texto.</span>
          </span>
        </label>
        <h2>Nombre de archivo</h2>
        <div class="fields">
          <label>Prefijo <input id="prefix" type="text" autocomplete="off" spellcheck="false" /></label>
          <label>Sufijo <input id="suffix" type="text" autocomplete="off" spellcheck="false" /></label>
        </div>
      </div>
      <div class="activity">
        <p class="summary hidden" id="summary"></p>
        <ul class="errors" id="errors"></ul>
        <p class="note hidden" id="focus-note"></p>
      </div>
      <footer>
        <button class="primary" id="export" type="button" disabled>
          <span id="export-fill"></span>
          <span id="export-label">Exportar SVG</span>
        </button>
      </footer>
    </main>
    <!-- ui-script -->
  </body>
</html>
